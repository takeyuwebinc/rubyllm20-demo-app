# The ten RubyLLM 2.0 features, in the order of the requirements.
#
# Every demo has a one-line summary and at least one source in the RubyLLM
# documentation. useful_cases and without_it are written together, when the
# feature's scenario is implemented and can be checked against the gem source.
#
# A scenario with no handler is being prepared. An implemented scenario lists
# its providers (used to tell whether it can run), its models by the keyword
# the handler takes, its inputs, how to show its result, and whether a job
# that runs again may start it over (retryable). A scenario that submits work
# to the provider, or does something that cannot be undone, is not retryable:
# starting over would submit the work twice or do it again.
#
# Inputs are sent to Sentry with the prompt. Keep every default fictional.

- key: responses-api
  name: Responses API
  summary: 推論、ツール、プロバイダー側のツールを 1 回の問い合わせで扱いたい
  useful_cases: |-
    OpenAI のモデルで、推論、ツールの呼び出し、Web 検索のようなプロバイダー側のツールを、1 回の問い合わせの中で組み合わせたい場合に役立つ。Responses API では、モデルが 1 回の API リクエストの中で、自前のツールとプロバイダー側のツールを含む複数のツールを呼べる。OpenAI は、新しく作るものには Chat Completions より Responses API を勧めている。

    RubyLLM 2.0 は、OpenAI のモデルへの問い合わせを、既定で Responses API で送る。アプリのコードは `RubyLLM.chat(model:).ask` のままでよい。ただし、音声、リアルタイム、検索用のモデルは、Chat Completions で送る。
  without_it: |-
    Chat Completions で送り続けると、GPT-5.4 以降のモデルでは、推論の強さ（reasoning_effort）を none 以外にしたままツールを呼べない。推論とツールのどちらかを諦めることになる。

    Responses API を自前で呼ぶ場合は、入出力の形が Chat Completions と違うことに対応する必要がある。Responses API の入出力は、推論、ツールの呼び出し、その結果を別々の項目として持つ。リクエストの組み立て、項目ごとの解釈、ストリーミングのイベントの処理、エラーの変換を、自分で書いて保守することになる。
  sources:
    - title: Upgrading（RubyLLM）— OpenAI の既定のプロトコルが Responses API であること
      url: https://rubyllm.com/upgrading/
    - title: Advanced Request Control（RubyLLM）— プロトコルの選び方
      url: https://rubyllm.com/chat-request-control/
    - title: Migrate to the Responses API（OpenAI）
      url: https://developers.openai.com/api/docs/guides/migrate-to-responses
  scenarios:
    - key: answer_inquiry
      name: 顧客からの問い合わせに回答する
      handler: ResponsesApi::AnswerInquiry
      providers: [openai]
      # A model RubyLLM sends through the Responses API. Audio, realtime, and
      # search models go through Chat Completions, which defeats this demo.
      models:
        model: gpt-5-nano
      inputs:
        - name: inquiry
          label: 顧客からの問い合わせ文
          required: true
          default: |-
            先週注文したワイヤレスイヤホン（注文番号 A-10234）が、まだ届きません。配送状況を確認する方法と、届かない場合にどうすればよいかを教えてください。
      result_kind: text_answer
      retryable: true

- key: citations
  name: Citations
  summary: 規約や契約のように、回答の根拠を読み手が検証する必要がある
  sources:
    - title: Citations（RubyLLM）
      url: https://rubyllm.com/citations/
  scenarios:
    - key: cite_return_policy
      name: 返品ポリシーに基づいて回答する

- key: tool-approval
  name: Tool Approval
  official_name: Human Approval for Tools
  summary: 返金、削除、送信のように取り消せない操作を AI に提案させ、実行するかどうかは人が決めたい
  useful_cases: |-
    返金、削除、送信のように取り消せない操作を AI に提案させ、実行するかどうかは人が決めたい場合に役立つ。ツールのクラスで `requires_approval` を宣言すると、モデルがそのツールを呼んでも、人の決定があるまで実行されない。`ask` は承認待ちの状態で戻り、`pending_approvals` で決定待ちの呼び出し（ツール名と引数）を読める。

    決定は `approve` と `deny` で記録し、`complete` で続きを実行する。承認した呼び出しはそこで実行され、却下した呼び出しは実行されずに、却下されたという結果がモデルに渡る。モデルはそれを踏まえて応答する。

    Rails では、決定はツール呼び出しの記録に残る。Web のプロセスで決定を記録し、別のジョブが `complete` で続きを実行できる。記録は、`chat_model` を宣言した `RubyLLM::Agent` のクラスの `find` で読み込むと、指示文とツールが復元される。`Chat.find` だけでは、ツールが承認を要することが分からず、止まらずに進んでしまう。中断で処理がもう一度動くことがあるため、ツールは 2 度実行しても安全に書く。このデモの返金は、返金済みの注文には何もしない。
  without_it: |-
    `requires_approval` のないツールは、モデルが呼んだ時点で `ask` の内側で実行され、人が割り込む余地がない。決定を記録しても無視される。

    人の決定を挟むには、ループを自分で進める（`ask_later`、`generate`、`run_tools`）。応答にツール呼び出しが含まれるかを調べ、決定を自分の記録として保存し、承認ならツールを実行し、却下なら却下の結果をツールの結果として自分で組み立ててモデルに渡し、別のプロセスで続きを実行する。この仕組みを、自分で書いて保守することになる。
  sources:
    - title: Controlling Tool Execution（RubyLLM）— Requiring Approval と Approval in Rails
      url: https://rubyllm.com/tool-execution/#requiring-approval
    - title: Durable Agents（RubyLLM）— Parking for a Human Decision
      url: https://rubyllm.com/durable-agents/#parking-for-a-human-decision
    - title: Agents（RubyLLM）— Rails-Backed Agents
      url: https://rubyllm.com/agents/#rails-backed-agents
    - title: What's New in 2.0（RubyLLM）— Human Approval for Tools
      url: https://rubyllm.com/whats-new-in-2-0/#human-approval-for-tools
  scenarios:
    - key: approve_refund
      name: AI が提案した返金を承認する
      handler: ToolApproval::AnswerRefundRequest
      providers: [openai]
      models:
        model: gpt-5-nano
      inputs:
        - name: inquiry
          label: 返金を求める問い合わせ文
          required: true
          default: |-
            注文番号 C-30871 のコーヒーメーカーが、届いた時点で外装が割れていました。箱にも大きなへこみがあります。交換ではなく返金してください。
        - name: order
          label: 返金の対象の注文
          required: true
          default: |-
            注文番号 C-30871、ドリップ式コーヒーメーカー 1 台、7,980 円、クレジットカードで支払い済み、2026-09-18 に配達済み
      result_kind: refund_decision
      # Starting over would make a second order and a second proposal; a
      # run that stopped for approval continues its chat instead.
      retryable: false

- key: batches
  name: Batches
  summary: チケットの分類や要約のように、すぐに応答を返す必要がない、件数の多い処理を行いたい
  sources:
    - title: Batches（RubyLLM）
      url: https://rubyllm.com/batches/
  scenarios:
    - key: classify_tickets
      name: サポートチケットをまとめて分類する

- key: model-fallbacks
  name: Model Fallbacks
  summary: プロバイダーの障害やレート制限が起きても、応答を続けたい
  sources:
    - title: Error Handling（RubyLLM）
      url: https://rubyllm.com/error-handling/
  scenarios:
    - key: fall_back_to_another_provider
      name: 主モデルが応答できないときに予備モデルで回答する

- key: video-and-speech
  name: Video and Speech Generation
  summary: 回答文を読み上げる音声や、商品の説明文からの短い紹介動画を用意したい
  useful_cases: |-
    サポートの回答文や、自動音声応答の文面を読み上げたい場合に役立つ。`RubyLLM.speak` は、音声のバイト列を持つ `RubyLLM::Speech` を返す。`save` でファイルに書け、`to_blob` でバイト列を取り出して Rails の添付（Active Storage）にできる。このデモも、`to_blob` で実行に添付し、履歴から再生している。

    声にはプロバイダーの既定があり、`voice:` で選べる。形式は `mp3` が既定で、`format:` で選べる。OpenAI では、`provider_options:` の `instructions` で話し方を指示できる（`tts-1` と `tts-1-hd` では使えない）。ブロックを渡すと、音声を届いた順に受け取れるので、生成が終わる前に再生を始められる。

    計装イベント `speech.ruby_llm` で、生成にかかった時間が分かる。OpenAI の音声は使用量（トークン）を返さず、RubyLLM のモデルの登録簿にも単価がない。そのため RubyLLM のコストは不明になり、このアプリも Sentry にコストを送らない。

    OpenAI の API リファレンスでは、入力は 4,096 文字までとされている。ただし `gpt-4o-mini-tts` には、文書に載っていない 2,000 トークンの入力の上限があり、日本語では約 3,000 文字でこちらが先に効く（2026-09-22 に実際の API で確かめた。何文字で超えるかは文によって変わる）。超えると OpenAI が 400 で拒み、RubyLLM は `RubyLLM::BadRequestError` を投げる。日本語にも対応しているが、声は英語に最適化されている。

    OpenAI の利用規約は、AI が生成した音声であることを聞き手に明示するよう求めている。

    動画の生成（`RubyLLM.animate`）の説明は、商品の紹介動画の代表シナリオとあわせて用意する。
  without_it: |-
    プロバイダーの音声の API を直接呼ぶと、エンドポイント、パラメーターの名前（声、形式）、バイナリの応答の受け取り、ストリーミング、エラーの変換を、自分で書いて保守することになる。

    プロバイダーを替える（ElevenLabs、Gemini、Deepgram など）と、要求と応答の形が変わり、書き直しになる。たとえば ElevenLabs は声を名前ではなく ID で指定し、Gemini は生の PCM を返す。RubyLLM では、`model:` を替えるだけで同じ `RubyLLM::Speech` が返り、形式は `speech.format` と `speech.mime_type` で分かる。
  sources:
    - title: Text to Speech（RubyLLM）— Basic Speech Generation、Voices、Formats、Style
      url: https://rubyllm.com/text-to-speech/
    - title: What's New in 2.0（RubyLLM）— Video and Speech Generation
      url: https://rubyllm.com/whats-new-in-2-0/#video-and-speech-generation
    - title: Video Generation（RubyLLM）
      url: https://rubyllm.com/video-generation/
    - title: Text to speech（OpenAI）— 声、言語、形式、話し方の指示、AI が生成した音声であることの明示
      url: https://developers.openai.com/api/docs/guides/text-to-speech
    - title: Create speech（OpenAI）— 入力の上限とパラメーター
      url: https://developers.openai.com/api/reference/resources/audio/subresources/speech/methods/create
  scenarios:
    - key: speak_answer
      name: 回答文を読み上げる
      handler: VideoAndSpeech::SpeakAnswer
      providers: [openai]
      # A model that takes instructions on how to speak; tts-1 and tts-1-hd
      # do not.
      models:
        model: gpt-4o-mini-tts
      # Only the answer is an input. The voice and the manner of speaking
      # are fixed in the handler, where the code shows how to choose them;
      # a voice given as an input would need checking against the voices
      # the model has.
      inputs:
        - name: text
          label: 読み上げる回答文
          required: true
          default: |-
            お問い合わせいただき、ありがとうございます。ご注文のワイヤレスイヤホン（注文番号 A-10234）は、配送センターの混雑により、お届けが 2 日ほど遅れております。ご不便をおかけして、申し訳ございません。本日中に、発送のお知らせをメールでお送りします。メールに記載の追跡番号から、配送状況をご確認いただけます。お届けの予定日を過ぎても届かない場合は、このメールにご返信ください。
      result_kind: speech
      retryable: true
    - key: generate_product_video
      name: 商品の紹介動画を生成する

- key: provider-tools
  name: Provider Tools
  summary: Web 検索やコードの実行環境を、自前で構築、運用したくない
  useful_cases: |-
    Web 検索の仕組みを自前で構築、運用したくない場合に役立つ。`with_provider_tools(:web_search)` を付けるだけで、モデルがプロバイダーの側で検索とページの閲覧を行い、最新の情報を回答に含める。アプリは質問を 1 回送るだけで、検索のためのツールを書かない。OpenAI では `:web_search` がページの閲覧も担うので、別の `:web_fetch` は要らない。

    `:web_search`、`:code_execution`、`:file_search`、`:mcp` などの別名は、プロバイダーごとにプロバイダーの形に変換される。対応しないプロバイダーでは、リクエストの時点で `RubyLLM::UnsupportedServerToolError` になる。許可するドメインのような選択肢は、`with_provider_tools(web_search: { ... })` の形で、プロバイダーの語彙のまま渡す。

    行われた検索は、応答の `server_tool_calls` で読める。OpenAI では 1 件ごとに、検索した語句や開いたページの URL を持つ。出典は `citations` で読める。URL、題名、回答の該当する範囲を持ち、文書の引用と同じ `Citation` のオブジェクトである。OpenAI の注釈が指す「回答の該当する範囲」は、主張の文ではなく、モデルが回答の中に書いた出典のリンクの部分である。Rails では、メッセージの記録の `server_tool_calls` と `citations` の列に残る。

    課金は、検索の回数（OpenAI では 1,000 回あたり 10 ドル）と、検索結果のトークン（モデルの入力の単価）である。RubyLLM が求めるコストはトークンの単価だけによるもので、検索の回数の課金を含まない。そのため、Sentry に載るコストは実際より小さい。このアプリで確かめた既定の質問の応答では、検索 6 回の課金 0.06 ドルに対し、RubyLLM が求めたコストは約 0.006 ドルだった。検索の回数は、応答の本体の `tool_usage`（文書には載っていない）の `num_requests` に載る。その応答では、`server_tool_calls` のうち操作の種類が `search` のものの件数と一致し、ページを開く操作（`open_page`）は数えられていなかった。また OpenAI は、`gpt-5` で推論の強さを `minimal` にすると Web 検索を使えないとしている。
  without_it: |-
    検索エンジンの API を選んで契約し、自前のツールとして関数を書くことになる。検索結果の取得、ページの本文の取り出し、要約、回答の文と出典の対応づけを、自分で実装して保守する。

    モデルは検索の語句を決めるだけで、検索と閲覧の往復のたびに、ツールの呼び出しと結果の受け渡しが要る。往復の回数だけ、問い合わせが増える。
  sources:
    - title: Provider Tools（RubyLLM）— Enabling Provider Tools、Tool Options、Reading Results
      url: https://rubyllm.com/provider-tools/
    - title: What's New in 2.0（RubyLLM）— Provider Tools
      url: https://rubyllm.com/whats-new-in-2-0/#provider-tools
    - title: Web search（OpenAI）— 出力の項目と注釈、対応するモデルと推論の強さ
      url: https://developers.openai.com/api/docs/guides/tools-web-search
    - title: Pricing（OpenAI）— Built-in tools（Web 検索の課金）
      url: https://developers.openai.com/api/docs/pricing#built-in-tools
  scenarios:
    - key: search_web
      name: Web 検索で最新の情報を含めて回答する
      handler: ProviderTools::AnswerWithWebSearch
      providers: [openai]
      # A model that can search the web. RubyLLM sends it through the
      # Responses API, where :web_search becomes OpenAI's web_search tool.
      models:
        model: gpt-5-nano
      inputs:
        - name: question
          label: 最新の情報を必要とする質問
          required: true
          default: |-
            お客様への案内を見直すために確かめたいことがあります。日本の通信販売の返品や、宅配便の配送に関わる法律や制度で、この 1 年に施行または改正されたものはありますか。出典を示して教えてください。
      result_kind: web_search_answer
      # Starting over asks and searches again, and is billed again, but leaves
      # nothing half done.
      retryable: true
    - key: run_code
      name: 注文データを集計するコードを実行する

- key: deep-research
  name: Deep Research
  official_name: Hosted Research
  summary: 数分以上の待ち時間を許容して、複数の情報源にあたった調査レポートを得たい
  useful_cases: |-
    複数の情報源にあたる調査を、検索、ページの取得、調査の計画、レポートの執筆まで含めてプロバイダーのエージェントに任せ、数分以上の待ち時間を許容してレポートを得たい場合に役立つ。

    `RubyLLM.research_later` は調査を投入するだけで、`id` を持つジョブをすぐに返す。ID を自分の記録に保存しておけば、別のプロセスから `RubyLLM::ResearchJob.find(id, provider: :vertexai)` で読み込み、`refresh` か `wait` で完了を待てる。RubyLLM は調査の記録のテーブルを用意しないので、ID の保存はアプリの役目になる。

    レポートはチャットの応答と同じ `RubyLLM::Message` で、`content`、`citations`、`thinking`、`server_tool_calls` を持つ。ただし、途中の手順、思考の要約、出典の URL は省かれることがある。`job.tokens` でトークン数が分かる（出力は思考を含む）。プロバイダーが金額を返さず、エージェントには単価がないため、コスト（`job.cost.total`）は不明になる。`report.model` は `nil` で、エージェントはモデルではない。出力の予算などで途中で打ち切られたレポートは、`job.incomplete?` と `finish_reason` の `:max_tokens` で分かる。失敗と取り消しは `message` を読むと例外になり、状態と理由はジョブに残る。

    ブロッキングの `RubyLLM.research` は、待ちの途中の例外や中断で取り消しを試みる。このアプリは投入と待ちを分け、取り消しを試みない。

    組み込みで対応するプロバイダーは 2.0.0 では Vertex AI だけである（OpenAI と Azure は、Responses のバックグラウンドモードで長い調査は走るが、取得、ポーリング、取り消しの仕組みがない）。Vertex AI の Deep Research エージェント（`deep-research-preview-04-2026`）は Preview で、ロケーションは `global` に限られる。ツールを指定しなければ Google 検索と URL コンテキスト（ページの取得）を使う。完了まで数分かかり、実行時間の上限は 120 分である。課金はトークンとツールの実行（検索とグラウンディング）の合算で、プロンプトと生成物はプロバイダー側に 7 日間保存される。

    このアプリは、投入の直後にジョブ ID を実行に控え、同じジョブの中で状態を取得して完了を待つ（間隔と上限はコード断片の定数にある）。アプリの停止でジョブが待ち行列に戻されても、次のジョブは控えた ID から続きを待ち、調査をもう一度投入しない。状態の取得が続けられる種類の失敗（ネットワーク、障害、レート制限、認証情報の失効など）になったときは、実行中のまま 1 分後にやり直す。コンソールから `RubyLLM::ResearchJob.find(id, provider: :vertexai).cancel` で取り消すと、実行は「取り消し」になる。

    Sentry のトレースには、投入（プロンプト、エージェント、ジョブ ID を持つ `research_job` のスパン）と状態の取得のリクエストだけが載る。投入と待ちはチャットのイベントを発行しないため、レポートの本文、トークン数、コストはトレースに載らず、実行の画面で読む。
  without_it: |-
    検索のツール、ページの取得のツール、調査の計画と繰り返しのループ、出典の追跡、長時間の実行の中断と再開を、自分で書いて保守することになる。

    Vertex AI の Interactions API を直接呼ぶ場合は、投入、状態の取得、応答の手順（`steps`）からのレポート、出典、思考、使用量の読み取りと、エラーの変換を自分で書く。RubyLLM では、レポートがチャットと同じ `Message` と `Citation` になり、ジョブ ID からの復元と取り消しが用意されている。
  sources:
    - title: Hosted Research（RubyLLM）
      url: https://rubyllm.com/hosted-research/
    - title: What's New in 2.0（RubyLLM）— Hosted Research
      url: https://rubyllm.com/whats-new-in-2-0/#hosted-research
    - title: Use the Gemini Deep Research Agent（Google Cloud）
      url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/agents/use-deep-research
    - title: Provider API Coverage（RubyLLM）— Asynchronous research
      url: https://rubyllm.com/provider-coverage/
  scenarios:
    - key: research_topic
      name: 調査テーマのレポートを作る
      handler: DeepResearch::ResearchTopic
      providers: [vertexai]
      # No models: the agent is not a model of RubyLLM's registry, and the
      # handler keeps its ID.
      inputs:
        - name: topic
          label: 調査テーマ
          required: true
          default: |-
            家電と日用品を扱う EC サイトのサポートデスクで、返品と交換の案内文を見直しています。
            日本の通信販売における返品・キャンセルに関する法制度（特定商取引法の返品特約の表示、クーリング・オフの適用の有無など）と、消費者庁や国民生活センターなどの公的機関の指針を整理してください。
            案内文に反映すべき点を挙げ、各点に出典を付けてください。
      result_kind: research_report
      # Starting over would submit another research and pay for it again.
      retryable: false

- key: tokenization
  name: Tokenization and Token Counting
  summary: 送信前に入力のトークン数を数えたい、テキストがトークンにどう分割されるかを知りたい
  useful_cases: |-
    送信する前に、指示文、履歴、ツール、スキーマ、添付を含めた入力のトークン数を、プロバイダー自身の数え方で知りたい場合に役立つ。`chat.count_tokens(question)` は、組み立てた会話に質問を足した入力のトークン数を返す。質問は会話に加えないので、数えた後で同じ会話に `ask` できる。

    数えるのは、プロバイダーの計数エンドポイントである。OpenAI では、Responses API の input_tokens に、通常の問い合わせと同じ形の入力を送る。応答は生成されない。そのため、ローカルのトークナイザーでは再現しにくい画像、ツール定義、モデルごとの整形も含めて数えられる。

    上限は、会話がモデルの登録簿（`RubyLLM.models`）から解決したモデルの情報（`chat.model`）の `context_window` と比べる。このデモでは、入力トークン数がコンテキストウィンドウより小さければ「収まる」と判定し、残りを余地として示す。`max_output_tokens` は、余地のうち出力に使える分の目安として並べる。

    計数は、出力の長さも、課金される使用量も示さない。送信後の使用量は、応答の `tokens` と `cost` で読む。プロバイダー側のツール、`provider_options`、compaction、`before_request` による変更は数えられないので、それらを使う会話では、実際に送る入力と数がずれることがある。計数は使用量を記録せず、chat の計装イベントも発行しない。このアプリの Sentry のトレースには計数のリクエストだけが載り、トークン数とコストは載らない。数えた結果は実行の画面で読む。

    会話の計数（`count_tokens`）とテキストの分割（`RubyLLM.tokenize`）は、プロバイダーの別のエンドポイントを使う。会話を数えられるのは OpenAI、Anthropic、Gemini、Bedrock、Vertex AI（Gemini のモデルに限る。Vertex AI 上の Claude では数えられない）である。xAI、Cohere、GPUStack はテキストの分割にだけ対応する。公式の Provider API Coverage の表は 2 つを「Token counting」の 1 行にまとめているため、xAI でも会話を数えられるように見える。対応しないプロバイダーでは `RubyLLM::Error` になる。
  without_it: |-
    ローカルのトークナイザー（tiktoken など）で見積もると、指示文やメッセージの区切りの整形、ツール定義、画像、モデルごとの違いを自分で再現する必要があり、プロバイダーが数える値とずれる。

    送ってみて、上限超過のエラー（`RubyLLM::ContextLengthExceededError`）で知る方法では、送ってからでないと分からない。上限に近い入力を、送る前に切り詰める判断ができない。
  sources:
    - title: Tokenization（RubyLLM）— Counting a Chat Request と Token Counts and Usage
      url: https://rubyllm.com/tokenization/#counting-a-chat-request
    - title: What's New in 2.0（RubyLLM）— Tokenization and Token Counting
      url: https://rubyllm.com/whats-new-in-2-0/#tokenization-and-token-counting
    - title: Counting tokens（OpenAI）
      url: https://developers.openai.com/api/docs/guides/token-counting
    - title: Get input token counts（OpenAI）
      url: https://developers.openai.com/api/reference/resources/responses/subresources/input_tokens/methods/count
  scenarios:
    - key: count_tokens
      name: 送信前に入力のトークン数を数える
      handler: Tokenization::CountInputTokens
      providers: [openai]
      # A model sent through the Responses API, which has the counting
      # endpoint, and whose context window the registry knows.
      models:
        model: gpt-5-nano
      inputs:
        - name: instructions
          label: 指示文
          required: true
          default: |-
            あなたは、家電と日用品を扱う架空の EC サイトのサポートデスクの担当者です。
            次の返品ポリシーに沿って、顧客からの問い合わせに丁寧な日本語で簡潔に回答してください。

            返品ポリシー:
            - 商品の到着から 30 日以内なら返品できます。
            - 未開封の商品は、理由を問わず返品できます。返送の送料は顧客の負担です。
            - 開封済みの商品は、初期不良または配送中の破損の場合に限り返品できます。返送の送料は当社の負担です。
            - 食品、消耗品（フィルター、電池など）、セール品は返品できません。
            - 返金は、返品の到着を確認してから 7 営業日以内に、支払いに使った方法で行います。
        - name: question
          label: 顧客からの問い合わせ文
          required: true
          default: |-
            3 週間前に届いた電気ケトル（注文番号 D-40518）を開封して使ってみましたが、思っていたより音が大きいので返品したいです。返品できますか。返送の送料はどちらの負担になりますか。
      result_kind: token_count
      # Counting changes nothing, so starting over only counts again.
      retryable: true
    - key: tokenize_text
      name: テキストのトークンへの分割を見る

- key: workflow-instrumentation
  name: Workflow Instrumentation
  summary: 複数のステップからなる処理で、どのステップが時間とコストを使っているかを特定したい
  useful_cases: |-
    分類、回答の下書き、レビューのように、モデルを何度も呼ぶ処理で、どのステップが時間とコストを使っているかを知りたい場合に役立つ。`RubyLLM.workflow` のブロックの内側で発行される計装イベントには、workflow の ID と名前が付く。`workflow.step` のブロックの内側なら、ステップの ID と名前も付く。workflow とステップ自身も、ブロックの前後で計装イベントを発行するので、ステップごとの所要時間が分かる。

    処理の流れは、通常の Ruby のまま書ける。`RubyLLM.workflow` と `step` は計装イベントに識別子を付けるだけで、処理の実行を引き受けない。条件分岐や繰り返しも、そのまま Ruby で書く。`metadata:` に渡した値（利用者や実行の ID など）は、その workflow のイベントに `workflow_metadata` として載る。

    workflow は入れ子にできる。内側の workflow は自分の ID と名前を持ち、イベントに外側の workflow の ID を載せる。そのため、自分の workflow を開くクラスを、より大きな workflow から呼ぶと、内側が部分木として現れる。このデモでも、実行のジョブが開いた workflow の中で、下のコードの workflow が入れ子になる。

    Rails では、計装イベントは ActiveSupport::Notifications で発行される。購読者を書けば、OpenTelemetry のスパンなど、使っている観測の仕組みの形にして送れる。このアプリでは、購読者がスパンにして Sentry に送っている。
  without_it: |-
    計装イベントが、どの処理のどの段階で発行されたものか分からない。同じモデルを 3 回呼ぶ処理では、3 つの chat のイベントは、モデルもプロバイダーも同じで、見分けがつかない。

    段階ごとの所要時間、トークン数、コストを知るには、段階の境目で時刻を測って集計する仕組みと、処理を識別する値を呼び出しごとに引き回す仕組みを、自分で書いて保守することになる。
  sources:
    - title: Instrumentation and Observability（RubyLLM）— workflow とステップがイベントに付ける情報と、入れ子の扱い
      url: https://rubyllm.com/instrumentation/#workflows-and-steps
    - title: Agentic Workflows（RubyLLM）— workflow とステップが処理の実行を引き受けないこと
      url: https://rubyllm.com/agentic-workflows/
  scenarios:
    - key: run_ticket_workflow
      name: チケットの分類、回答の下書き、レビューを順に行う
      handler: WorkflowInstrumentation::RunTicketWorkflow
      providers: [openai]
      # One model for every step, so the steps differ in tokens only because
      # their work differs.
      models:
        model: gpt-5-nano
      inputs:
        - name: ticket
          label: サポートチケット
          required: true
          default: |-
            先週届いた電気ケトル（注文番号 B-20517）の電源が入りません。コンセントを差し替えても、ランプが点きません。交換してもらえますか。それとも修理に出す必要がありますか。
      result_kind: ticket_workflow
      retryable: true
