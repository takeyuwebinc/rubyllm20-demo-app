# The ten RubyLLM 2.0 features, in the order of the requirements.
#
# Every demo has a one-line summary and at least one source in the RubyLLM
# documentation. useful_cases and without_it are written together, when the
# feature's scenario is implemented and can be checked against the gem source.
#
# A scenario with no handler is being prepared. An implemented scenario lists
# its providers (used to tell whether it can run), its models by the keyword
# the handler takes, its inputs, the documents it hands the handler (files
# under public/, by the keyword the handler takes), how to show its result,
# and whether a job that runs again may start it over (retryable). A scenario that submits work
# to the provider, or does something that cannot be undone, is not retryable:
# starting over would submit the work twice or do it again.
#
# Inputs are sent to Sentry with the prompt. Keep every default fictional.

- key: responses-api
  name: Responses API
  summary: 推論、ツール、プロバイダー側のツールを 1 回の問い合わせで扱いたい
  useful_cases: |-
    OpenAI のモデルで、推論、ツールの呼び出し、Web 検索のようなプロバイダー側のツールを、1 回の問い合わせの中で組み合わせたい場合に役立つ。Responses API では、モデルが 1 回の API リクエストの中で、自前のツールとプロバイダー側のツールを含む複数のツールを呼べる。OpenAI は、新しく作るものには Chat Completions より Responses API を勧めている。

    RubyLLM 2.0 は、OpenAI のモデルへの問い合わせを、既定で Responses API で送る。アプリのコードは `RubyLLM.chat(model:).ask` のままでよい。ただし、音声、リアルタイム、検索用のモデルは、Chat Completions で送る。
  without_it: |-
    Chat Completions で送り続けると、GPT-5.4 以降のモデルでは、推論の強さ（reasoning_effort）を none 以外にしたままツールを呼べない。推論とツールのどちらかを諦めることになる。

    Responses API を自前で呼ぶ場合は、入出力の形が Chat Completions と違うことに対応する必要がある。Responses API の入出力は、推論、ツールの呼び出し、その結果を別々の項目として持つ。リクエストの組み立て、項目ごとの解釈、ストリーミングのイベントの処理、エラーの変換を、自分で書いて保守することになる。
  sources:
    - title: Upgrading（RubyLLM）— OpenAI の既定のプロトコルが Responses API であること
      url: https://rubyllm.com/upgrading/
    - title: Advanced Request Control（RubyLLM）— プロトコルの選び方
      url: https://rubyllm.com/chat-request-control/
    - title: Migrate to the Responses API（OpenAI）
      url: https://developers.openai.com/api/docs/guides/migrate-to-responses
  scenarios:
    - key: answer_inquiry
      name: 顧客からの問い合わせに回答する
      handler: ResponsesApi::AnswerInquiry
      providers: [openai]
      # A model RubyLLM sends through the Responses API. Audio, realtime, and
      # search models go through Chat Completions, which defeats this demo.
      models:
        model: gpt-5-nano
      inputs:
        - name: inquiry
          label: 顧客からの問い合わせ文
          required: true
          default: |-
            先週注文したワイヤレスイヤホン（注文番号 A-10234）が、まだ届きません。配送状況を確認する方法と、届かない場合にどうすればよいかを教えてください。
      result_kind: text_answer
      retryable: true

- key: citations
  name: Citations
  summary: 規約や契約のように、回答の根拠を読み手が検証する必要がある
  useful_cases: |-
    規約、契約、マニュアルのように、回答の根拠を読み手が確かめる必要がある場合に役立つ。`with_citations` を付けて、文書を `ask` の `with:` で添付すると、応答の `citations` に、回答のどの範囲（`text`、`start_index`、`end_index`）が文書のどの引用（`cited_text`）に基づくかが載る。PDF なら、引用のページ（`start_page`、`end_page`。1 始まりで、両端を含む）も載る。このデモでは、回答の該当する範囲の末尾に番号の印を入れ、出典の一覧から PDF のそのページを開けるようにしている。

    文書の引用に対応するのは、Anthropic、Cohere、Bedrock（Converse）上の Claude である。Anthropic は、文書を文の単位に分け、その単位で引用する。PDF は本文を取り出して引用するので、本文を取り出せないスキャンだけの PDF と、画像は引用できない。

    引用は API が文書から取り出すので、指し先は必ず文書の中にある。ただし、その引用が主張を支えているかどうかは、読み手が判断する。

    `cited_text` は出力トークンに数えられない。一方、コストには文書のトークンが含まれる。PDF の各ページは、本文（1 ページあたり 1,500〜3,000 トークン）と画像の両方として処理され、両方が課金される。Anthropic では、文書の引用と `with_schema` を併用できない。

    Rails では、出典はメッセージの記録の `citations` の列に残る。このアプリの Sentry には、問い合わせ文と回答の本文が載り、添付した文書と出典は載らない。出典は実行の画面で読む。
  without_it: |-
    プロンプトで「根拠を引用して」と頼む方法では、引用が文書に実在するかを照合する仕組みを自分で作ることになる。モデルが引用を書き換えたり作ったりしても、それを検出する仕組みがない。引用の文字数の分だけ、出力トークンもかかる。

    ページや位置を知るには、文書を自分で分割して番号を付けて渡し、番号を返させる形式を決めて解析することになる。回答のどの文がどの引用に基づくかの対応づけも、出力の形式を決めて解析することになる。
  sources:
    - title: Citations（RubyLLM）— Citing Your Documents、The Citation Object、ActiveRecord Integration
      url: https://rubyllm.com/citations/
    - title: What's New in 2.0（RubyLLM）— Citations
      url: https://rubyllm.com/whats-new-in-2-0/#citations
    - title: Citations（Anthropic）— 文書の種類、ページ番号、トークン
      url: https://platform.claude.com/docs/en/build-with-claude/citations
    - title: PDF support（Anthropic）— 上限と処理
      url: https://platform.claude.com/docs/en/build-with-claude/pdf-support
  scenarios:
    - key: cite_return_policy
      name: 返品ポリシーに基づいて回答する
      handler: Citations::AnswerFromReturnPolicy
      providers: [anthropic]
      # A model the registry lists with citations and with PDF input, the
      # stronger one for quotes from a Japanese document, as cost is not
      # capped. Should claude-sonnet-5 be refused, use the dated
      # claude-haiku-4-5-20251001: the registry lists the alias
      # claude-haiku-4-5 without citations, and RubyLLM then only warns.
      models:
        model: claude-sonnet-5
      inputs:
        - name: inquiry
          label: 顧客からの問い合わせ文
          required: true
          # Asks about all three pages of the policy: whether and at whose
          # cost (page 1), the replacement filter (page 2), the refund (page 3).
          default: |-
            2 週間前に届いた空気清浄機（注文番号 E-50712）を、まだ開封していませんが、部屋に合わないので返品したいです。返品できますか。返送の送料はどちらの負担になりますか。返金はいつ、どのような方法で受けられますか。また、同じ箱で届いた交換用のフィルター（未開封）も一緒に返品できますか。
      # A PDF, because its pages are what a citation of a PDF adds: RubyLLM
      # reads no position from a citation of a text document. A fixed one,
      # made once from its HTML, so that no PDF gem or font comes into the
      # app and the code shown stays RubyLLM's, and so that its pages and
      # quotes stay the same from run to run. Remaking it leaves the sources
      # of earlier runs pointing at pages that have changed.
      documents:
        - name: policy
          label: 返品ポリシー文書（PDF、3 ページ）
          path: documents/return-policy.pdf
      result_kind: cited_answer
      # Starting over asks again, and is billed again, but leaves nothing
      # half done.
      retryable: true

- key: tool-approval
  name: Tool Approval
  official_name: Human Approval for Tools
  summary: 返金、削除、送信のように取り消せない操作を AI に提案させ、実行するかどうかは人が決めたい
  useful_cases: |-
    返金、削除、送信のように取り消せない操作を AI に提案させ、実行するかどうかは人が決めたい場合に役立つ。ツールのクラスで `requires_approval` を宣言すると、モデルがそのツールを呼んでも、人の決定があるまで実行されない。`ask` は承認待ちの状態で戻り、`pending_approvals` で決定待ちの呼び出し（ツール名と引数）を読める。

    決定は `approve` と `deny` で記録し、`complete` で続きを実行する。承認した呼び出しはそこで実行され、却下した呼び出しは実行されずに、却下されたという結果がモデルに渡る。モデルはそれを踏まえて応答する。

    Rails では、決定はツール呼び出しの記録に残る。Web のプロセスで決定を記録し、別のジョブが `complete` で続きを実行できる。記録は、`chat_model` を宣言した `RubyLLM::Agent` のクラスの `find` で読み込むと、指示文とツールが復元される。`Chat.find` だけでは、ツールが承認を要することが分からず、止まらずに進んでしまう。中断で処理がもう一度動くことがあるため、ツールは 2 度実行しても安全に書く。このデモの返金は、返金済みの注文には何もしない。
  without_it: |-
    `requires_approval` のないツールは、モデルが呼んだ時点で `ask` の内側で実行され、人が割り込む余地がない。決定を記録しても無視される。

    人の決定を挟むには、ループを自分で進める（`ask_later`、`generate`、`run_tools`）。応答にツール呼び出しが含まれるかを調べ、決定を自分の記録として保存し、承認ならツールを実行し、却下なら却下の結果をツールの結果として自分で組み立ててモデルに渡し、別のプロセスで続きを実行する。この仕組みを、自分で書いて保守することになる。
  sources:
    - title: Controlling Tool Execution（RubyLLM）— Requiring Approval と Approval in Rails
      url: https://rubyllm.com/tool-execution/#requiring-approval
    - title: Durable Agents（RubyLLM）— Parking for a Human Decision
      url: https://rubyllm.com/durable-agents/#parking-for-a-human-decision
    - title: Agents（RubyLLM）— Rails-Backed Agents
      url: https://rubyllm.com/agents/#rails-backed-agents
    - title: What's New in 2.0（RubyLLM）— Human Approval for Tools
      url: https://rubyllm.com/whats-new-in-2-0/#human-approval-for-tools
  scenarios:
    - key: approve_refund
      name: AI が提案した返金を承認する
      handler: ToolApproval::AnswerRefundRequest
      providers: [openai]
      models:
        model: gpt-5-nano
      inputs:
        - name: inquiry
          label: 返金を求める問い合わせ文
          required: true
          default: |-
            注文番号 C-30871 のコーヒーメーカーが、届いた時点で外装が割れていました。箱にも大きなへこみがあります。交換ではなく返金してください。
        - name: order
          label: 返金の対象の注文
          required: true
          default: |-
            注文番号 C-30871、ドリップ式コーヒーメーカー 1 台、7,980 円、クレジットカードで支払い済み、2026-09-18 に配達済み
      result_kind: refund_decision
      # Starting over would make a second order and a second proposal; a
      # run that stopped for approval continues its chat instead.
      retryable: false

- key: batches
  name: Batches
  summary: チケットの分類や要約のように、すぐに応答を返す必要がない、件数の多い処理を行いたい
  sources:
    - title: Batches（RubyLLM）
      url: https://rubyllm.com/batches/
  scenarios:
    - key: classify_tickets
      name: サポートチケットをまとめて分類する

- key: model-fallbacks
  name: Model Fallbacks
  summary: プロバイダーの障害やレート制限が起きても、応答を続けたい
  useful_cases: |-
    プロバイダーの障害やレート制限が起きても、応答を続けたい場合に役立つ。`with_fallbacks` に予備モデルを順に渡すと、生成がレート制限、サーバー側のエラー、サービス停止、過負荷、タイムアウト、接続の失敗で失敗したときに、次のモデルで同じ会話を送り直す。予備モデルは別のプロバイダーのモデルでもよい。会話の履歴、指示文、ツール、スキーマは予備モデルに引き継がれるので、予備モデルがそれらに対応している必要がある。

    認証の失敗、不正なリクエスト、入力の上限超過、モデル名の誤りでは切り替わらない。切り替えの対象にする例外は `on:` で選べる。切り替えの前には、同じモデルへのリトライ（`max_retries`、既定 3 回）が先に尽きる。レート制限でプロバイダーが示す待ち時間（Retry-After）が `retry_max_interval` を超えると、待たずに失敗し、すぐ切り替わる。切り替えはその 1 回の生成だけに効き、次の問い合わせは主モデルに戻る。

    `before_fallback` で、切り替え元（`from`）、切り替え先（`to`）、きっかけの例外（`error`）、試行番号（`attempt`）を読める。`after_fallback` では、それらに加えて成否（`succeeded?` と `fallback_error`）を読める。使用量とコストは失敗した試行を含めて集計される。使用量の分からない失敗（サーバー側のエラーやタイムアウト）が含まれると、合計のコストは `nil` になる。計装イベント `usage.ruby_llm` は、試行ごとに 1 回ずつ出る。

    このデモでは、主モデル（OpenAI）の送信先を、文脈（`RubyLLM.context`）で到達できないホストに向けて障害を再現している。文脈はアプリ全体の設定の複製なので、予備モデル（Anthropic）にはいつもどおり送られ、ほかのデモにも影響しない。Sentry のトレースには、主モデルの失敗した試行（初回とリトライ 3 回の計 4 回）と、予備モデルの成功した試行が並ぶ。ただし、失敗した試行 1 回ずつの所要時間は分からない。試行のイベントは瞬間の記録で、リトライは 1 回の送信（`POST responses`）の内側で起きるためである。分かるのは 4 回をまとめた所要時間で、2026-09-23 に確かめたときは約 0.8 秒だった。主モデルへの送信は OpenAI に届かないので、課金は起きない。このデモの実行が失敗として記録されるのは、予備モデルも失敗したときである。そのとき失敗の表示のプロバイダーの欄には両方のプロバイダー名が出るが、記録されるのは予備モデル（Anthropic）の失敗である。
  without_it: |-
    予備モデルに切り替えるには、例外を rescue して別のモデルの会話を組み立て直し、履歴、指示文、添付を相手のプロバイダーの形で送り直す処理を、自分で書いて保守することになる。

    リトライと切り替えの順序、ストリーミングの途中で失敗したときの扱い、試行ごとの使用量とコストの集計、切り替えの後に元のモデルへ戻す処理も、自分で決めて書くことになる。
  sources:
    - title: Error Handling（RubyLLM）— Model Fallbacks、Fallback Callbacks、Automatic Retries
      url: https://rubyllm.com/error-handling/#model-fallbacks
    - title: What's New in 2.0（RubyLLM）— Model Fallbacks
      url: https://rubyllm.com/whats-new-in-2-0/#model-fallbacks
    - title: "Connection, Logging and Contexts（RubyLLM）— Timeouts & Retries（Retry-After と retry_max_interval）、Contexts: Isolated Configurations（送信先の上書き）"
      url: https://rubyllm.com/configuration-connection/#timeouts--retries
    - title: Instrumentation and Observability（RubyLLM）— Usage Events（試行ごとのイベント）
      url: https://rubyllm.com/instrumentation/#usage-events
  scenarios:
    - key: fall_back_to_another_provider
      name: 主モデルが応答できないときに予備モデルで回答する
      handler: ModelFallbacks::AnswerWithFallback
      providers: [openai, anthropic]
      # The fallback is given as a model id. The registry resolves it to
      # Anthropic, the first provider in its order that offers it.
      models:
        model: gpt-5-nano
        fallback_model: claude-haiku-4-5
      inputs:
        - name: inquiry
          label: 顧客からの問い合わせ文
          required: true
          default: |-
            一昨日注文したコードレス掃除機（注文番号 E-61294）の配送予定日を知りたいです。受け取れない日があるので、配送日時を指定し直すことはできますか。
      result_kind: fallback_answer
      # Starting over asks once more, and pays for that one answer again.
      retryable: true

- key: video-and-speech
  name: Video and Speech Generation
  summary: 回答文を読み上げる音声や、商品の説明文からの短い紹介動画を用意したい
  useful_cases: |-
    サポートの回答文や、自動音声応答の文面を読み上げたい場合に役立つ。`RubyLLM.speak` は、音声のバイト列を持つ `RubyLLM::Speech` を返す。`save` でファイルに書け、`to_blob` でバイト列を取り出して Rails の添付（Active Storage）にできる。このデモも、`to_blob` で実行に添付し、履歴から再生している。

    声にはプロバイダーの既定があり、`voice:` で選べる。形式は `mp3` が既定で、`format:` で選べる。OpenAI では、`provider_options:` の `instructions` で話し方を指示できる（`tts-1` と `tts-1-hd` では使えない）。ブロックを渡すと、音声を届いた順に受け取れるので、生成が終わる前に再生を始められる。

    計装イベント `speech.ruby_llm` で、生成にかかった時間が分かる。OpenAI の音声は使用量（トークン）を返さず、RubyLLM のモデルの登録簿にも単価がない。そのため RubyLLM のコストは不明になり、このアプリも Sentry にコストを送らない。

    OpenAI の API リファレンスでは、入力は 4,096 文字までとされている。ただし `gpt-4o-mini-tts` には、文書に載っていない 2,000 トークンの入力の上限があり、日本語では約 3,000 文字でこちらが先に効く（2026-09-22 に実際の API で確かめた。何文字で超えるかは文によって変わる）。超えると OpenAI が 400 で拒み、RubyLLM は `RubyLLM::BadRequestError` を投げる。日本語にも対応しているが、声は英語に最適化されている。

    OpenAI の利用規約は、AI が生成した音声であることを聞き手に明示するよう求めている。

    商品の説明文から、短い紹介動画を用意したい場合にも役立つ。動画の生成は、どのプロバイダーでも、投入してから完成を待つ非同期の処理である。`RubyLLM.animate` は完成まで待って `RubyLLM::Video` を返す。`RubyLLM.animate_later` は投入だけを行い、`RubyLLM::VideoJob` をすぐ返す。`refresh` で状態を問い合わせ、`wait` で完成まで待ち、`video` で動画を受け取る。待ち時間の上限（既定は 600 秒）と問い合わせの間隔（既定は 5 秒）は、設定の `video_generation_timeout` と `video_generation_poll_interval`、または `wait` の引数で変えられる。

    xAI の文書では、完成まで典型的には最大で数分かかる。このデモは、`animate_later` が返した `VideoJob` の `id` を実行の記録に控えてから、同じジョブの中で `wait` する。アプリの停止でジョブが戻されても、控えた ID から待ち直し、動画を生成し直さない。ただし RubyLLM 2.0.0 には、ID から `VideoJob` を開き直す公開の API がない（`Batch` と `ResearchJob` にはある `find` が、`VideoJob` にはない）。このデモは、RubyLLM が内部で行う組み立てを 1 つのメソッドで再現している。gem のバージョンを固定しているので成り立つ。

    xAI は、完成した動画を一時的な URL で返す。`Video#to_blob` がその URL からダウンロードし、`save` はファイルに書く。URL の有効期間は文書に書かれていないので、残すならすぐにダウンロードする。このデモは、実行の成功を記録するときにダウンロードして添付している。

    xAI では、`provider_options:` で秒数（`duration`。1〜15 秒）、縦横比（`aspect_ratio`。既定は `16:9`）、解像度（`resolution`。既定は `480p`）、音声の有無（`generate_audio`。既定は付ける）を指定できる。料金は秒数と解像度で決まり、`grok-imagine-video-1.5` は 480p が 1 秒 0.08 ドル、720p が 0.14 ドル、1080p が 0.25 ドルである。このデモの 6 秒・480p の動画は 0.48 ドルになる。

    計装イベントは、投入の `video_job.ruby_llm` と、投入と状態の問い合わせの `request.ruby_llm` である。`video.ruby_llm` は `animate` を使ったときだけ発行され、ダウンロードは計装されない。xAI は状態の応答の `usage.cost_in_usd_ticks` に費用を返す（1 ティックは 100 億分の 1 ドル。このデモの動画では 4,800,000,000、つまり 0.48 ドルだった。2026-09-23 に実際の API で確かめた）。ただし RubyLLM 2.0.0 の `Video` はこれを読まず、RubyLLM のモデルの登録簿にも xAI の動画の単価がない。そのため RubyLLM のコストは不明になり、このアプリも Sentry にコストを送らない。費用が要るときは、`video.raw` の `usage` から読む。
  without_it: |-
    プロバイダーの音声の API を直接呼ぶと、エンドポイント、パラメーターの名前（声、形式）、バイナリの応答の受け取り、ストリーミング、エラーの変換を、自分で書いて保守することになる。

    プロバイダーを替える（ElevenLabs、Gemini、Deepgram など）と、要求と応答の形が変わり、書き直しになる。たとえば ElevenLabs は声を名前ではなく ID で指定し、Gemini は生の PCM を返す。RubyLLM では、`model:` を替えるだけで同じ `RubyLLM::Speech` が返り、形式は `speech.format` と `speech.mime_type` で分かる。

    動画の API を直接呼ぶと、投入、状態の問い合わせの繰り返し、状態の判定（xAI では `pending`、`done`、`failed`、`expired`）、ダウンロードを自分で書くことになる。処理の ID の形、状態の名前、応答の形はプロバイダーごとに違う。RubyLLM は、状態を `VideoJob` の `status`（`:pending`、`:completed`、`:failed`）にそろえる。
  sources:
    - title: Text to Speech（RubyLLM）— Basic Speech Generation、Voices、Formats、Style
      url: https://rubyllm.com/text-to-speech/
    - title: What's New in 2.0（RubyLLM）— Video and Speech Generation
      url: https://rubyllm.com/whats-new-in-2-0/#video-and-speech-generation
    - title: Video Generation（RubyLLM）
      url: https://rubyllm.com/video-generation/
    - title: Text to speech（OpenAI）— 声、言語、形式、話し方の指示、AI が生成した音声であることの明示
      url: https://developers.openai.com/api/docs/guides/text-to-speech
    - title: Create speech（OpenAI）— 入力の上限とパラメーター
      url: https://developers.openai.com/api/reference/resources/audio/subresources/speech/methods/create
    - title: Video Generation（xAI）— エンドポイント、パラメーター、状態、一時的な URL、エラー
      url: https://docs.x.ai/developers/model-capabilities/video/generation
    - title: Imagine Overview（xAI）— 非同期の流れ、秒数と解像度による料金
      url: https://docs.x.ai/developers/model-capabilities/imagine
    - title: grok-imagine-video-1.5（xAI）— 解像度ごとの料金
      url: https://docs.x.ai/developers/models/grok-imagine-video-1.5
  scenarios:
    - key: speak_answer
      name: 回答文を読み上げる
      handler: VideoAndSpeech::SpeakAnswer
      providers: [openai]
      # A model that takes instructions on how to speak; tts-1 and tts-1-hd
      # do not.
      models:
        model: gpt-4o-mini-tts
      # Only the answer is an input. The voice and the manner of speaking
      # are fixed in the handler, where the code shows how to choose them;
      # a voice given as an input would need checking against the voices
      # the model has.
      inputs:
        - name: text
          label: 読み上げる回答文
          required: true
          default: |-
            お問い合わせいただき、ありがとうございます。ご注文のワイヤレスイヤホン（注文番号 A-10234）は、配送センターの混雑により、お届けが 2 日ほど遅れております。ご不便をおかけして、申し訳ございません。本日中に、発送のお知らせをメールでお送りします。メールに記載の追跡番号から、配送状況をご確認いただけます。お届けの予定日を過ぎても届かない場合は、このメールにご返信ください。
      result_kind: speech
      retryable: true
    - key: generate_product_video
      name: 商品の紹介動画を生成する
      handler: VideoAndSpeech::GenerateProductVideo
      providers: [xai]
      models:
        model: grok-imagine-video-1.5
      # Only the description is an input. The length, resolution, and aspect
      # ratio are fixed in the handler, where the code shows how to choose
      # them, and where they keep the cost of a run known.
      inputs:
        - name: description
          label: 商品の説明文
          required: true
          default: |-
            ステンレス製の電気ケトル「ソラ」。容量は 1.0 リットルで、マットな白の本体に木目調の取っ手が付いています。注ぎ口が細く、ハンドドリップのコーヒーにも使えます。沸騰すると自動で電源が切れます。
      result_kind: product_video
      # Starting over would generate the video, and pay for it, again. A job
      # that runs again waits for the video by the id the run keeps.
      retryable: false

- key: provider-tools
  name: Provider Tools
  summary: Web 検索やコードの実行環境を、自前で構築、運用したくない
  useful_cases: |-
    Web 検索の仕組みを自前で構築、運用したくない場合に役立つ。`with_provider_tools(:web_search)` を付けるだけで、モデルがプロバイダーの側で検索とページの閲覧を行い、最新の情報を回答に含める。アプリは質問を 1 回送るだけで、検索のためのツールを書かない。OpenAI では `:web_search` がページの閲覧も担うので、別の `:web_fetch` は要らない。

    `:web_search`、`:code_execution`、`:file_search`、`:mcp` などの別名は、プロバイダーごとにプロバイダーの形に変換される。対応しないプロバイダーでは、リクエストの時点で `RubyLLM::UnsupportedServerToolError` になる。許可するドメインのような選択肢は、`with_provider_tools(web_search: { ... })` の形で、プロバイダーの語彙のまま渡す。

    行われた検索は、応答の `server_tool_calls` で読める。OpenAI では 1 件ごとに、検索した語句や開いたページの URL を持つ。出典は `citations` で読める。URL、題名、回答の該当する範囲を持ち、文書の引用と同じ `Citation` のオブジェクトである。OpenAI の注釈が指す「回答の該当する範囲」は、主張の文ではなく、モデルが回答の中に書いた出典のリンクの部分である。Rails では、メッセージの記録の `server_tool_calls` と `citations` の列に残る。

    課金は、検索の回数（OpenAI では 1,000 回あたり 10 ドル）と、検索結果のトークン（モデルの入力の単価）である。RubyLLM が求めるコストはトークンの単価だけによるもので、検索の回数の課金を含まない。そのため、Sentry に載るコストは実際より小さい。このアプリで確かめた既定の質問の応答では、検索 6 回の課金 0.06 ドルに対し、RubyLLM が求めたコストは約 0.006 ドルだった。検索の回数は、応答の本体の `tool_usage`（文書には載っていない）の `num_requests` に載る。その応答では、`server_tool_calls` のうち操作の種類が `search` のものの件数と一致し、ページを開く操作（`open_page`）は数えられていなかった。また OpenAI は、`gpt-5` で推論の強さを `minimal` にすると Web 検索を使えないとしている。

    コードを実行する隔離環境を自前で構築、運用したくない場合にも役立つ。`with_provider_tools(:code_execution)` は、OpenAI では `code_interpreter`（コンテナは `auto`）になる。モデルが Python のコードを書いてプロバイダーのコンテナで実行し、その出力を読んで回答する。アプリは問い合わせを 1 回送るだけで、コードを実行する場所もツールも持たない。

    実行されたコードは、`server_tool_calls` の `input` で読める。コードの出力は、RubyLLM の既定の要求では返らない。`with_provider_options` で `include` に `code_interpreter_call.outputs` を足すと、`result` に入る。`with_provider_options` の値は RubyLLM の既定値を置き換えるので、既定の `reasoning.encrypted_content` も並べて書く。実行の状態（`status`）とコンテナの ID（`container_id`）は RubyLLM が正規化しないので、`raw` で読む。コードが作ったファイルは `citations` の注釈になるだけで、OpenAI では `attachments` に入らない。

    プロバイダー側のツールだけを使う会話では、`with_tool_options` はツールの使用を強制しない（RubyLLM 2.0.0 のソースで確かめた。公式のガイドには書かれていない）。強制するには、`tool_choice` を `with_provider_options` でプロバイダーの語彙のまま渡す。このアプリで確かめたところ、指示文で頼むだけでは、2 回のうち 1 回はコードを実行せずに回答した。

    コード実行の課金は、コンテナとトークンである。コンテナは定価で、1 GB のコンテナの 20 分のセッションあたり 0.03 ドルである（料金の文書は、対象のセッションを分単位で最低 5 分として課金するとも書く）。RubyLLM が求めるコストはトークンの単価だけによるもので、コンテナの課金を含まない。そのため、Sentry に載るコストは実際より小さい。このアプリで確かめた既定の入力の応答（3 回）では、RubyLLM が求めたコストは約 0.0009〜0.0012 ドルで、コンテナの定価 0.03 ドルの 30 分の 1 前後だった。コンテナの回数は応答の本体に載らない。各ステップの `container_id` で、使われたコンテナを区別できる。
  without_it: |-
    検索エンジンの API を選んで契約し、自前のツールとして関数を書くことになる。検索結果の取得、ページの本文の取り出し、要約、回答の文と出典の対応づけを、自分で実装して保守する。

    モデルは検索の語句を決めるだけで、検索と閲覧の往復のたびに、ツールの呼び出しと結果の受け渡しが要る。往復の回数だけ、問い合わせが増える。

    コードを実行させるには、モデルが書いたコードを安全に実行する隔離環境（コンテナやサンドボックス）を用意し、実行時間、メモリ、ネットワークの制限と、環境の破棄を自分で運用することになる。コードを受け取って実行し、出力をモデルに返す往復も、自前のツールとして書く。
  sources:
    - title: Provider Tools（RubyLLM）— Enabling Provider Tools、Tool Options、Reading Results
      url: https://rubyllm.com/provider-tools/
    - title: What's New in 2.0（RubyLLM）— Provider Tools
      url: https://rubyllm.com/whats-new-in-2-0/#provider-tools
    - title: Advanced Request Control（RubyLLM）— Provider Options（with_provider_options が RubyLLM の既定値を上書きすること）
      url: https://rubyllm.com/chat-request-control/#provider-options
    - title: Web search（OpenAI）— 出力の項目と注釈、対応するモデルと推論の強さ
      url: https://developers.openai.com/api/docs/guides/tools-web-search
    - title: Code Interpreter（OpenAI）— コンテナの auto と再利用、既定の 1 GB、失効、ファイルの引用、tool_choice を required にする例
      url: https://developers.openai.com/api/docs/guides/tools-code-interpreter
    - title: Create a model response（OpenAI）— include の値、tool_choice、出力の項目 code_interpreter_call
      url: https://developers.openai.com/api/reference/resources/responses/methods/create
    - title: Pricing（OpenAI）— Built-in tools（Web 検索とコンテナの課金）
      url: https://developers.openai.com/api/docs/pricing#built-in-tools
  scenarios:
    - key: search_web
      name: Web 検索で最新の情報を含めて回答する
      handler: ProviderTools::AnswerWithWebSearch
      providers: [openai]
      # A model that can search the web. RubyLLM sends it through the
      # Responses API, where :web_search becomes OpenAI's web_search tool.
      models:
        model: gpt-5-nano
      inputs:
        - name: question
          label: 最新の情報を必要とする質問
          required: true
          default: |-
            お客様への案内を見直すために確かめたいことがあります。日本の通信販売の返品や、宅配便の配送に関わる法律や制度で、この 1 年に施行または改正されたものはありますか。出典を示して教えてください。
      result_kind: web_search_answer
      # Starting over asks and searches again, and is billed again, but leaves
      # nothing half done.
      retryable: true
    - key: run_code
      name: 注文データを集計するコードを実行する
      handler: ProviderTools::AnswerWithCodeExecution
      providers: [openai]
      # A model that can run code. RubyLLM sends it through the Responses
      # API, where :code_execution becomes OpenAI's code_interpreter tool in a
      # container that OpenAI creates, or reuses while it is still active.
      models:
        model: gpt-5-nano
      inputs:
        - name: orders
          label: 注文データ（CSV）
          required: true
          default: |-
            注文番号,注文日,カテゴリ,商品,金額,状態
            E-50101,2026-09-01,キッチン家電,電気ケトル,4980,支払い済み
            E-50102,2026-09-02,生活家電,コードレス掃除機,19800,支払い済み
            E-50103,2026-09-03,日用品,食器用洗剤（詰め替え）,398,支払い済み
            E-50104,2026-09-05,キッチン家電,コーヒーメーカー,7980,返金済み
            E-50105,2026-09-08,日用品,キッチンペーパー（6 ロール）,598,支払い済み
            E-50106,2026-09-10,生活家電,加湿器,8980,支払い済み
            E-50107,2026-09-12,キッチン家電,トースター,6480,支払い済み
            E-50108,2026-09-15,生活家電,電気毛布,3980,返金済み
        - name: request
          label: 集計の依頼
          required: true
          default: |-
            この注文データから、次の 3 つを求めてください。
            - カテゴリごとの売上金額の合計（返金済みの注文を除く）
            - 返金済みの注文の件数と金額の合計
            - 全体の平均注文金額（返金済みの注文を除く）
      result_kind: code_execution_answer
      # Starting over runs the code again, in a container created again, and
      # is billed again, but leaves nothing half done.
      retryable: true

